name: Build and Release Spectre

on:
  push:
    tags:
      - 'server-v*'
      - 'client-v*'
      - 'v*'

jobs:
  # ==========================================
  # BUILD SERVER EXECUTABLE
  # ==========================================
  build-server:
    if: startsWith(github.ref, 'refs/tags/server-v') || startsWith(github.ref, 'refs/tags/v')
    name: Build Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller textual rich

      - name: Build Server Executable with PyInstaller
        run: |
          pyinstaller --onefile --name spectre-server --collect-all textual server.py

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/spectre-server.exe release-assets/spectre-server-windows-amd64.exe
          else
            mv dist/spectre-server release-assets/spectre-server-linux-amd64
          fi

      - name: Publish Server Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Spectre Server Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # BUILD CLIENT EXECUTABLE
  # ==========================================
  build-client:
    if: startsWith(github.ref, 'refs/tags/client-v') || startsWith(github.ref, 'refs/tags/v')
    name: Build Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller textual rich

      - name: Build Client Executable with PyInstaller
        run: |
          pyinstaller --onefile --name spectre-client --collect-all textual --collect-all rich client.py

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/spectre-client.exe release-assets/spectre-client-windows-amd64.exe
          else
            mv dist/spectre-client release-assets/spectre-client-linux-amd64
          fi

      - name: Publish Client Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Spectre Client Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
