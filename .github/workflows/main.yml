name: Build and Release Spectre

on:
  push:
    tags:
      - 'server-v*'
      - 'client-v*'
      - 'v*'

jobs:
  # ==========================================
  # BUILD SERVER EXECUTABLE
  # ==========================================
  build-server:
    if: startsWith(github.ref, 'refs/tags/server-v') || startsWith(github.ref, 'refs/tags/v')
    name: Build Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller textual rich

      - name: Build Server Executable
        run: |
          pyinstaller --onefile --name spectre-server --collect-all textual server.py

      - name: Stage Server Asset
        shell: bash
        run: |
          mkdir -p server-assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/spectre-server.exe server-assets/spectre-server-windows-amd64.exe
          else
            mv dist/spectre-server server-assets/spectre-server-linux-amd64
          fi

      - name: Upload Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-assets-${{ matrix.os }}
          path: server-assets/*

  # ==========================================
  # BUILD CLIENT EXECUTABLE
  # ==========================================
  build-client:
    if: startsWith(github.ref, 'refs/tags/client-v') || startsWith(github.ref, 'refs/tags/v')
    name: Build Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller textual rich

      - name: Build Client Executable
        run: |
          pyinstaller --onefile --name spectre-client --collect-all textual --collect-all rich client.py

      - name: Stage Client Asset
        shell: bash
        run: |
          mkdir -p client-assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/spectre-client.exe client-assets/spectre-client-windows-amd64.exe
          else
            mv dist/spectre-client client-assets/spectre-client-linux-amd64
          fi

      - name: Upload Client Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-assets-${{ matrix.os }}
          path: client-assets/*

  # ==========================================
  # CONSOLIDATED SINGLE-PUBLISH RELEASE JOB
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-server, build-client]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-artifacts

      - name: Consolidate Staged Assets
        run: |
          mkdir -p release-dist
          find raw-artifacts -type f -exec cp {} release-dist/ \;
          echo "Assets ready for release:"
          ls -la release-dist/

      - name: Create Single GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Spectre Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
